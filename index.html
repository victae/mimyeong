<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>미명 (未明) - 동성교회 새벽기도</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: '#0B132B',
            cardDark: '#1C2541',
            accentNavy: '#3A506B',
            tealAccent: '#5BC0BE',
            brightAqua: '#6FFFE9',
            textLight: '#E0E1DD'
          },
          fontFamily: {
            sans: ['Noto Sans KR', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      background-color: #0B132B;
      color: #E0E1DD;
      font-family: 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* 2분 만료 시 깜빡이는 넛지 애니메이션 */
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(91, 192, 190, 0.3); box-shadow: 0 0 15px rgba(91, 192, 190, 0.2); }
      50% { border-color: rgba(111, 255, 233, 0.9); box-shadow: 0 0 30px rgba(111, 255, 233, 0.6); }
    }

    .time-expired-nudge {
      animation: pulse-border 1.5s infinite ease-in-out;
    }

    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0B132B;
    }
    ::-webkit-scrollbar-thumb {
      background: #3A506B;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-hidden antialiased">

  <!-- 상단 헤더 -->
  <header class="w-full bg-cardDark/80 backdrop-blur-md border-b border-accentNavy/40 px-4 py-3 flex items-center justify-between z-30">
    <div class="flex items-center space-x-3">
      <!-- 교회 CI 로고 (오류 시 텍스트 파서) -->
      <img id="church-logo" src="./assets/dongsung-logo.png" alt="동성교회" class="h-8 object-contain" onError="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
      <div id="logo-fallback" class="hidden text-tealAccent font-bold text-lg tracking-wider">
        동성교회
      </div>
      <div class="border-l border-accentNavy/60 pl-3">
        <h1 class="text-lg font-bold text-brightAqua leading-none tracking-wide">미명 <span class="text-xs font-normal text-tealAccent/80">(未明)</span></h1>
        <p class="text-[10px] text-textLight/60 tracking-tight">새벽을 깨우는 중보기도</p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <!-- 설정/교역자 변경 버튼 -->
      <button id="btn-open-settings" class="px-2.5 py-1.5 rounded-lg bg-accentNavy/50 hover:bg-accentNavy text-xs text-textLight flex items-center space-x-1.5 transition">
        <i class="fa-solid fa-sliders text-tealAccent"></i>
        <span id="header-user-info" class="hidden sm:inline font-medium">교역자 선택</span>
      </button>
    </div>
  </header>

  <!-- 2분 진행률 프로그레스 바 -->
  <div class="w-full bg-accentNavy/30 h-1.5 relative z-30 overflow-hidden">
    <div id="timer-progress" class="bg-gradient-to-r from-tealAccent to-brightAqua h-full w-0 transition-all duration-300 ease-linear"></div>
  </div>

  <!-- 메인 콘텐츠 영역 (카테고리 선택 및 카드 슬라이드) -->
  <main class="flex-1 relative flex flex-col justify-center items-center px-4 py-3 max-w-2xl w-full mx-auto z-10 overflow-hidden">

    <!-- 상단 기도 카테고리 탭 -->
    <div class="w-full mb-3 flex bg-cardDark/90 p-1 rounded-xl border border-accentNavy/40 text-xs sm:text-sm z-20">
      <button id="tab-member" class="flex-1 py-2 rounded-lg font-medium transition text-center text-brightAqua bg-accentNavy/80 shadow">
        <i class="fa-solid fa-users text-xs mr-1"></i>성도 기도
      </button>
      <button id="tab-patient" class="flex-1 py-2 rounded-lg font-medium transition text-center text-textLight/60 hover:text-textLight">
        <i class="fa-solid fa-heart-pulse text-xs mr-1"></i>환우 집중
      </button>
      <button id="tab-mission" class="flex-1 py-2 rounded-lg font-medium transition text-center text-textLight/60 hover:text-textLight">
        <i class="fa-solid fa-earth-asia text-xs mr-1"></i>선교·협력
      </button>
    </div>

    <!-- 카드 컨테이너 (터치 제스처 영역) -->
    <div id="card-touch-zone" class="relative w-full flex-1 flex flex-col justify-center items-center cursor-pointer select-none my-1">
      
      <!-- 좌측 30% 영역 안내 레이어 -->
      <div class="absolute left-0 top-0 bottom-0 w-[30%] z-20 opacity-0 hover:opacity-10 transition-opacity bg-tealAccent/20 rounded-l-2xl flex items-center justify-start pl-2 pointer-events-none">
        <i class="fa-solid fa-chevron-left text-2xl text-brightAqua"></i>
      </div>

      <!-- 우측 70% 영역 안내 레이어 -->
      <div class="absolute right-0 top-0 bottom-0 w-[70%] z-20 opacity-0 hover:opacity-10 transition-opacity bg-tealAccent/20 rounded-r-2xl flex items-center justify-end pr-2 pointer-events-none">
        <i class="fa-solid fa-chevron-right text-2xl text-brightAqua"></i>
      </div>

      <!-- 실제 기도 카드 -->
      <div id="prayer-card" class="w-full h-full max-h-[500px] bg-cardDark/95 border-2 border-accentNavy/60 rounded-2xl p-6 shadow-2xl flex flex-col justify-between transition-all duration-300 relative overflow-hidden">
        
        <!-- 카드 상단 메타데이터 -->
        <div class="flex items-start justify-between border-b border-accentNavy/40 pb-3 mb-3">
          <div>
            <div class="flex items-center space-x-2">
              <span id="card-badge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-tealAccent/20 text-brightAqua border border-tealAccent/40">
                이번달 집중
              </span>
              <span id="card-sub-info" class="text-xs text-textLight/60">
                등록일
              </span>
            </div>
            <h2 class="text-2xl sm:text-3xl font-bold text-textLight mt-2 flex items-baseline gap-2">
              <span id="card-title-name">로딩 중</span>
              <span id="card-title-role" class="text-base font-normal text-tealAccent"></span>
            </h2>
          </div>
          <div class="text-right">
            <span id="card-counter" class="text-xs font-mono px-2 py-1 bg-bgDark/80 rounded-lg text-brightAqua border border-accentNavy/40">
              0 / 0
            </span>
          </div>
        </div>

        <!-- 기도제목 본문 영역 -->
        <div id="card-body-scroll" class="flex-1 overflow-y-auto py-2 pr-1 my-2">
          <p id="card-content" class="text-lg sm:text-xl text-textLight/90 leading-relaxed font-normal whitespace-pre-line tracking-wide">
            기도제목 데이터를 불러오는 중입니다...
          </p>
        </div>

        <!-- 카드 하단 정보 및 2분 타이머 -->
        <div class="pt-3 border-t border-accentNavy/40 flex items-center justify-between text-xs text-textLight/70">
          <div class="flex items-center space-x-1.5">
            <i class="fa-regular fa-clock text-tealAccent"></i>
            <span>권장 기도시간 2분</span>
          </div>
          <div class="flex items-center space-x-2">
            <span id="timer-display" class="font-mono text-sm font-bold text-brightAqua">02:00</span>
          </div>
        </div>

      </div>

    </div>

    <!-- 터치 구역 안내 힌트 -->
    <p class="text-[11px] text-textLight/40 mt-1 text-center">
      <i class="fa-solid fa-hand-pointer mr-1"></i>좌측 30% 터치: 이전 | 우측 70% 터치: 다음 (좌우 스와이프 가능)
    </p>

  </main>

  <!-- 하단 컨트롤 바 -->
  <footer class="w-full bg-cardDark/90 border-t border-accentNavy/40 px-4 py-3 z-30">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      
      <!-- 이전 버튼 -->
      <button id="btn-prev" class="w-11 h-11 rounded-xl bg-accentNavy/40 hover:bg-accentNavy/80 text-brightAqua flex items-center justify-center transition active:scale-95">
        <i class="fa-solid fa-chevron-left text-lg"></i>
      </button>

      <!-- 타이머 일시정지 / 재생 -->
      <button id="btn-toggle-timer" class="px-4 py-2.5 rounded-xl bg-tealAccent/20 hover:bg-tealAccent/30 text-brightAqua border border-tealAccent/40 flex items-center space-x-2 transition active:scale-95">
        <i id="timer-icon" class="fa-solid fa-pause text-sm"></i>
        <span id="timer-btn-text" class="text-xs font-medium">일시정지</span>
      </button>

      <!-- 자동 넘김 토글 -->
      <button id="btn-toggle-auto" class="px-3 py-2.5 rounded-xl bg-accentNavy/30 border border-accentNavy/50 text-xs text-textLight/70 flex items-center space-x-1.5 transition">
        <i id="auto-icon" class="fa-solid fa-toggle-on text-tealAccent text-sm"></i>
        <span>자동넘김</span>
      </button>

      <!-- 다음 버튼 -->
      <button id="btn-next" class="w-11 h-11 rounded-xl bg-tealAccent text-bgDark font-bold flex items-center justify-center shadow-lg hover:bg-brightAqua transition active:scale-95">
        <i class="fa-solid fa-chevron-right text-lg"></i>
      </button>

    </div>
  </footer>

  <!-- 설정 모달 -->
  <div id="modal-settings" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-cardDark border border-accentNavy rounded-2xl w-full max-w-md p-6 shadow-2xl relative space-y-5">
      
      <div class="flex items-center justify-between border-b border-accentNavy/50 pb-3">
        <h3 class="text-lg font-bold text-brightAqua flex items-center space-x-2">
          <i class="fa-solid fa-user-gear"></i>
          <span>기도 환경 설정</span>
        </h3>
        <button id="btn-close-modal" class="text-textLight/60 hover:text-textLight p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- 교역자 선택 -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-tealAccent block">1. 담당 교역자 선택</label>
        <div class="grid grid-cols-3 gap-2">
          <button data-pastor="0" class="btn-pastor p-3 rounded-xl border border-accentNavy/60 bg-bgDark/60 text-xs text-center transition hover:border-tealAccent">
            <div class="font-bold text-sm text-textLight">박태한</div>
            <div class="text-[10px] text-textLight/50 mt-0.5">목사/전도사</div>
          </button>
          <button data-pastor="1" class="btn-pastor p-3 rounded-xl border border-accentNavy/60 bg-bgDark/60 text-xs text-center transition hover:border-tealAccent">
            <div class="font-bold text-sm text-textLight">최호민</div>
            <div class="text-[10px] text-textLight/50 mt-0.5">목사/전도사</div>
          </button>
          <button data-pastor="2" class="btn-pastor p-3 rounded-xl border border-accentNavy/60 bg-bgDark/60 text-xs text-center transition hover:border-tealAccent">
            <div class="font-bold text-sm text-textLight">박호준</div>
            <div class="text-[10px] text-textLight/50 mt-0.5">목사/전도사</div>
          </button>
        </div>
      </div>

      <!-- Day 선택 (4일 순환) -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-tealAccent block">2. 주간 기도 진행일 선택 (4일 순환)</label>
        <div class="grid grid-cols-4 gap-2">
          <button data-day="1" class="btn-day p-2.5 rounded-xl border border-accentNavy/60 bg-bgDark/60 text-xs font-semibold text-center hover:border-tealAccent">Day 1</button>
          <button data-day="2" class="btn-day p-2.5 rounded-xl border border-accentNavy/60 bg-bgDark/60 text-xs font-semibold text-center hover:border-tealAccent">Day 2</button>
          <button data-day="3" class="btn-day p-2.5 rounded-xl border border-accentNavy/60 bg-bgDark/60 text-xs font-semibold text-center hover:border-tealAccent">Day 3</button>
          <button data-day="4" class="btn-day p-2.5 rounded-xl border border-accentNavy/60 bg-bgDark/60 text-xs font-semibold text-center hover:border-tealAccent">Day 4</button>
        </div>
        <p class="text-[11px] text-textLight/50 mt-1">
          * 3인의 교역자가 4일간 서로 다른 구역에서 출발하여 전체 성도 기도제목을 100% 기도합니다.
        </p>
      </div>

      <!-- Google Apps Script API URL 설정 -->
      <div class="space-y-2 pt-2 border-t border-accentNavy/40">
        <label class="text-xs font-semibold text-tealAccent block">3. 구글 연동 API Web App URL</label>
        <input id="input-api-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" class="w-full bg-bgDark border border-accentNavy rounded-xl px-3 py-2 text-xs text-textLight focus:outline-none focus:border-tealAccent">
        <p class="text-[10px] text-textLight/40">입력하지 않으면 기본 목업(Mock) 데이터로 동작합니다.</p>
      </div>

      <!-- 저장 버튼 -->
      <button id="btn-save-settings" class="w-full py-3 rounded-xl bg-gradient-to-r from-tealAccent to-brightAqua text-bgDark font-bold text-sm shadow-lg hover:opacity-95 transition">
        설정 저장 및 기도 시작
      </button>

    </div>
  </div>

  <!-- JavaScript 애플리케이션 로직 -->
  <script>
    const MOCK_DATA = {
      members: [
        { id: 1, name: "김은혜", role: "권사", date: "2026.08.15", type: "이번달 집중", content: "1. 자녀의 대학 입시와 믿음의 진로를 위해 기도합니다.\n2. 남편 사업장의 경제적 어려움이 회복되고 예배가 회복되게 하소서." },
        { id: 2, name: "박철민", role: "집사", date: "2026.08.16", type: "응답시까지 지속", content: "1. 직장 내 직분자로서 빛과 소금의 역할을 감당하게 하소서.\n2. 양가 부모님의 건강과 영혼 구원을 위해 간구합니다." },
        { id: 3, name: "이영희", role: "교우", date: "2026.08.17", type: "이번달 집중", content: "1. 새로 시작하는 영아부 교사 사역에 은혜를 더하여 주소서.\n2. 온 가족이 주일 성수를 기쁨으로 지키게 하소서." },
        { id: 4, name: "정요한", role: "청년", date: "2026.08.18", type: "응답시까지 지속", content: "1. 비전과 진로를 결정하는 시기에 주님의 인도하심을 받게 하소서.\n2. 청년부 리더로서 말씀 중심의 공동체를 세워가게 하소서." },
        { id: 5, name: "최정숙", role: "권사", date: "2026.08.18", type: "이번달 집중", content: "1. 새벽기도의 자리를 늘 지키며 교회를 위해 중보하는 권사가 되게 하소서.\n2. 손주들의 지혜와 성장을 위해 기도합니다." },
        { id: 6, name: "한지훈", role: "안수집사", date: "2026.08.19", type: "응답시까지 지속", content: "1. 남선교회 총무 사역에 지혜와 건강을 더하여 주소서.\n2. 가정이 늘 기쁨과 감사가 넘치는 제단이 되게 하소서." }
      ],
      patients: [
        { id: 101, name: "오성수", role: "집사", date: "2026.08.10", type: "항암 치료 중", content: "1. 3차 항암 치료 과정 중 부작용이 최소화되고 체력이 회복되게 하소서.\n2. 마음의 평안과 구원의 확신이 더욱 견고해지게 하소서." },
        { id: 102, name: "강순자", role: "권사", date: "2026.08.12", type: "수술 후 회복", content: "1. 관절 수술 후 재활 치료가 순조롭게 진행되어 스스로 걸을 수 있게 하소서.\n2. 통증이 완화되고 밤에 단잠을 잘 수 있도록 도와주소서." }
      ],
      missions: [
        { id: 201, name: "태국 방콕 선교지", role: "김선교 선교사", date: "2026.08.01", type: "협력 선교지", content: "1. 현지 센터 개척 사역에 필요한 영적·물질적 필요가 채워지게 하소서.\n2. 선교사 가족의 건강과 자녀들의 현지 적응을 위해 기도합니다." },
        { id: 202, name: "동성 제주비전교회", role: "이충성 목사", date: "2026.08.05", type: "지원 교회", content: "1. 여름 어린이 성경학교를 통해 복음의 열매가 맺히게 하소서.\n2. 성전 리모델링 과정이 안전하게 완료되게 하소서." }
      ]
    };

    const PASTORS = ["박태한", "최호민", "박호준"];

    let state = {
      pastorIndex: parseInt(localStorage.getItem('mimyeong_pastor') || '0'),
      dayIndex: parseInt(localStorage.getItem('mimyeong_day') || '1'),
      apiUrl: localStorage.getItem('mimyeong_api_url') || '',
      category: 'member',
      data: MOCK_DATA,
      activeList: [],
      currentIndex: 0,
      timerSeconds: 120,
      timerInterval: null,
      isPaused: false,
      autoAdvance: true
    };

    const elCard = document.getElementById('prayer-card');
    const elBadge = document.getElementById('card-badge');
    const elSubInfo = document.getElementById('card-sub-info');
    const elName = document.getElementById('card-title-name');
    const elRole = document.getElementById('card-title-role');
    const elCounter = document.getElementById('card-counter');
    const elContent = document.getElementById('card-content');
    const elTimerDisplay = document.getElementById('timer-display');
    const elProgressBar = document.getElementById('timer-progress');
    const elHeaderUserInfo = document.getElementById('header-user-info');

    async function initApp() {
      setupEventListeners();
      updateHeaderInfo();
      
      if (state.apiUrl) {
        await fetchDataFromGAS();
      } else {
        filterDataByRotation();
      }
      
      startTimer();
    }

    function updateHeaderInfo() {
      const pastorName = PASTORS[state.pastorIndex] || "교역자";
      elHeaderUserInfo.textContent = `${pastorName} 목사 (Day ${state.dayIndex})`;
    }

    function filterDataByRotation() {
      if (state.category === 'patient') {
        state.activeList = state.data.patients || [];
      } else if (state.category === 'mission') {
        state.activeList = state.data.missions || [];
      } else {
        const rawList = state.data.members || [];
        const N = rawList.length;

        if (N === 0) {
          state.activeList = [];
          renderCard();
          return;
        }

        const pastorOffset = Math.floor(state.pastorIndex * (N / 3));
        const chunkSize = Math.ceil(N / 4);
        const dayOffset = (state.dayIndex - 1) * chunkSize;
        const startIndex = (pastorOffset + dayOffset) % N;

        let rotated = [];
        for (let i = 0; i < chunkSize; i++) {
          const idx = (startIndex + i) % N;
          rotated.push(rawList[idx]);
        }

        state.activeList = rotated;
      }

      state.currentIndex = 0;
      renderCard();
      resetTimer();
    }

    function renderCard() {
      elCard.classList.remove('time-expired-nudge');

      if (!state.activeList || state.activeList.length === 0) {
        elBadge.textContent = "안내";
        elSubInfo.textContent = "";
        elName.textContent = "기도제목 없음";
        elRole.textContent = "";
        elCounter.textContent = "0 / 0";
        elContent.textContent = "등록되거나 배정된 기도제목이 없습니다.";
        return;
      }

      const item = state.activeList[state.currentIndex];
      elBadge.textContent = item.type || "중보기도";
      elSubInfo.textContent = item.date || "";
      elName.textContent = item.name || "무명";
      elRole.textContent = item.role || "";
      elCounter.textContent = `${state.currentIndex + 1} / ${state.activeList.length}`;
      elContent.textContent = item.content || "";

      document.getElementById('card-body-scroll').scrollTop = 0;
    }

    function startTimer() {
      clearInterval(state.timerInterval);
      state.timerInterval = setInterval(() => {
        if (state.isPaused) return;

        if (state.timerSeconds > 0) {
          state.timerSeconds--;
          updateTimerUI();
        } else {
          onTimerExpired();
        }
      }, 1000);
    }

    function resetTimer() {
      state.timerSeconds = 120;
      updateTimerUI();
      elCard.classList.remove('time-expired-nudge');
    }

    function updateTimerUI() {
      const min = String(Math.floor(state.timerSeconds / 60)).padStart(2, '0');
      const sec = String(state.timerSeconds % 60).padStart(2, '0');
      elTimerDisplay.textContent = `${min}:${sec}`;

      const progressPercent = ((120 - state.timerSeconds) / 120) * 100;
      elProgressBar.style.width = `${progressPercent}%`;
    }

    function onTimerExpired() {
      elCard.classList.add('time-expired-nudge');

      if (state.autoAdvance) {
        setTimeout(() => {
          nextCard();
        }, 1500);
      }
    }

    function nextCard() {
      if (state.activeList.length === 0) return;
      state.currentIndex = (state.currentIndex + 1) % state.activeList.length;
      renderCard();
      resetTimer();
    }

    function prevCard() {
      if (state.activeList.length === 0) return;
      state.currentIndex = (state.currentIndex - 1 + state.activeList.length) % state.activeList.length;
      renderCard();
      resetTimer();
    }

    async function fetchDataFromGAS() {
      try {
        const res = await fetch(state.apiUrl);
        const json = await res.json();
        if (json && (json.members || json.patients || json.missions)) {
          state.data = json;
          filterDataByRotation();
        }
      } catch (err) {
        console.warn("API 연동 실패. 기본 데이터를 사용합니다.", err);
        state.data = MOCK_DATA;
        filterDataByRotation();
      }
    }

    function setupEventListeners() {
      document.getElementById('tab-member').addEventListener('click', (e) => switchCategory('member', e.currentTarget));
      document.getElementById('tab-patient').addEventListener('click', (e) => switchCategory('patient', e.currentTarget));
      document.getElementById('tab-mission').addEventListener('click', (e) => switchCategory('mission', e.currentTarget));

      document.getElementById('btn-next').addEventListener('click', nextCard);
      document.getElementById('btn-prev').addEventListener('click', prevCard);

      document.getElementById('btn-toggle-timer').addEventListener('click', () => {
        state.isPaused = !state.isPaused;
        const icon = document.getElementById('timer-icon');
        const text = document.getElementById('timer-btn-text');
        if (state.isPaused) {
          icon.className = 'fa-solid fa-play text-sm';
          text.textContent = '재생';
        } else {
          icon.className = 'fa-solid fa-pause text-sm';
          text.textContent = '일시정지';
        }
      });

      document.getElementById('btn-toggle-auto').addEventListener('click', () => {
        state.autoAdvance = !state.autoAdvance;
        const icon = document.getElementById('auto-icon');
        icon.className = state.autoAdvance ? 'fa-solid fa-toggle-on text-tealAccent text-sm' : 'fa-solid fa-toggle-off text-textLight/40 text-sm';
      });

      const touchZone = document.getElementById('card-touch-zone');
      touchZone.addEventListener('click', (e) => {
        const rect = touchZone.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;

        if (clickX < width * 0.3) {
          prevCard();
        } else {
          nextCard();
        }
      });

      let touchStartX = 0;
      touchZone.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      touchZone.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 40) {
          if (diff > 0) prevCard();
          else nextCard();
        }
      }, { passive: true });

      document.getElementById('btn-open-settings').addEventListener('click', openSettingsModal);
      document.getElementById('btn-close-modal').addEventListener('click', closeSettingsModal);
      document.getElementById('btn-save-settings').addEventListener('click', saveSettings);
    }

    function switchCategory(cat, targetBtn) {
      state.category = cat;
      const tabs = [document.getElementById('tab-member'), document.getElementById('tab-patient'), document.getElementById('tab-mission')];
      tabs.forEach(tab => {
        tab.className = 'flex-1 py-2 rounded-lg font-medium transition text-center text-textLight/60 hover:text-textLight';
      });
      targetBtn.className = 'flex-1 py-2 rounded-lg font-medium transition text-center text-brightAqua bg-accentNavy/80 shadow';
      filterDataByRotation();
    }

    function openSettingsModal() {
      document.getElementById('modal-settings').classList.remove('hidden');
      document.getElementById('input-api-url').value = state.apiUrl;

      document.querySelectorAll('.btn-pastor').forEach((btn, idx) => {
        if (idx === state.pastorIndex) {
          btn.classList.add('border-brightAqua', 'bg-tealAccent/20');
        } else {
          btn.classList.remove('border-brightAqua', 'bg-tealAccent/20');
        }
        btn.onclick = () => {
          document.querySelectorAll('.btn-pastor').forEach(b => b.classList.remove('border-brightAqua', 'bg-tealAccent/20'));
          btn.classList.add('border-brightAqua', 'bg-tealAccent/20');
          state.tempPastor = idx;
        };
      });

      document.querySelectorAll('.btn-day').forEach((btn) => {
        const dayVal = parseInt(btn.dataset.day);
        if (dayVal === state.dayIndex) {
          btn.classList.add('border-brightAqua', 'bg-tealAccent/20', 'text-brightAqua');
        } else {
          btn.classList.remove('border-brightAqua', 'bg-tealAccent/20', 'text-brightAqua');
        }
        btn.onclick = () => {
          document.querySelectorAll('.btn-day').forEach(b => b.classList.remove('border-brightAqua', 'bg-tealAccent/20', 'text-brightAqua'));
          btn.classList.add('border-brightAqua', 'bg-tealAccent/20', 'text-brightAqua');
          state.tempDay = dayVal;
        };
      });
    }

    function closeSettingsModal() {
      document.getElementById('modal-settings').classList.add('hidden');
    }

    function saveSettings() {
      if (state.tempPastor !== undefined) state.pastorIndex = state.tempPastor;
      if (state.tempDay !== undefined) state.dayIndex = state.tempDay;
      
      const newUrl = document.getElementById('input-api-url').value.trim();
      state.apiUrl = newUrl;

      localStorage.setItem('mimyeong_pastor', state.pastorIndex);
      localStorage.setItem('mimyeong_day', state.dayIndex);
      localStorage.setItem('mimyeong_api_url', state.apiUrl);

      updateHeaderInfo();
      closeSettingsModal();

      if (state.apiUrl) {
        fetchDataFromGAS();
      } else {
        filterDataByRotation();
      }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
